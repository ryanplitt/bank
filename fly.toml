# Fly.io configuration for Bank.
#
# IMPORTANT: Bank keeps all game state in memory and Socket.IO needs session
# affinity, so this runs at EXACTLY ONE instance. Do not scale out beyond one
# machine. A single instance is also the only way the app is correct — multiple
# instances would fragment rooms between replicas.
#
# Fly machines keep a machine running when min_machines_running = 1 and keep
# the machine's IP stable across deploys so long-lived WebSocket connections
# and stored player sessions keep working.

app = "bank"

[build]

# Internal port the server listens on (the container's PORT env var).
[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
