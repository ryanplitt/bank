name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Build client
        run: npm run build

      # Playwright smoke suite: boots the real server against the built client
      # (client/dist/ from the previous step) and drives three browser contexts
      # through a full game. Config: testDir ./e2e, workers: 1 (the spec owns a
      # shared server on a fixed port), headless, trace retain-on-failure. We
      # invoke `npx playwright test` directly rather than `npm run e2e`, which
      # would redundantly rebuild the client; the browser itself must be
      # installed here since the runner image ships none — `--with-deps` pulls
      # the system libraries Chromium needs, budgeted generously.
      - name: Playwright e2e
        timeout-minutes: 15
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Build Docker image
        run: docker build -t bank:ci .

  # Deploy to Fly.io once everything above is green, but only for pushes to
  # main (never for pull requests). Needs a FLY_API_TOKEN repository secret:
  #   fly tokens create deploy -a bank-yxkpxq
  # --ha=false keeps the app on exactly one machine (see fly.toml: rooms live in
  # memory, so a second machine would split them). The concurrency group stops
  # two deploys from running at once and never cancels one that is mid-flight.
  deploy:
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
